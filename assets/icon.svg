<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="dsh-verbose">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C1D21"/>
      <stop offset="1" stop-color="#121316"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4F9BFB"/>
      <stop offset="1" stop-color="#7BB8FF"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="1" y="1" width="510" height="510" rx="111" fill="none" stroke="#FFFFFF" stroke-opacity="0.07"/>

  <!-- transcript rows: three lines of text, the last one shorter -->
  <rect x="96" y="150" width="288" height="24" rx="12" fill="#E8EAED" fill-opacity="0.92"/>
  <rect x="96" y="206" width="240" height="24" rx="12" fill="#E8EAED" fill-opacity="0.72"/>
  <rect x="96" y="262" width="288" height="24" rx="12" fill="#E8EAED" fill-opacity="0.72"/>
  <rect x="96" y="318" width="176" height="24" rx="12" fill="url(#accent)"/>

  <!-- the "more detail" column: a vertical ellipsis -->
  <circle cx="404" cy="156" r="15" fill="url(#accent)"/>
  <circle cx="404" cy="212" r="15" fill="url(#accent)" fill-opacity="0.72"/>
  <circle cx="404" cy="268" r="15" fill="url(#accent)" fill-opacity="0.48"/>
</svg>
